<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diego OS</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19211c;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#17231c;color:#fff;padding:26px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 26px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#d4f33f;color:#17231c;font-weight:900}.brand span{display:block;color:#9eaaa1;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb9b1;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{color:white;background:#26352b;box-shadow:inset 3px 0 0 #d4f33f}.rule{margin-top:auto;border-top:1px solid #314036;padding:18px 8px 0;color:#b7c1ba;font-size:12px;line-height:1.5}main{padding:34px 42px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.top p{margin:0 0 4px;color:#748077;font-size:13px}h1,h2,h3,p{margin-top:0}h1{font-size:32px;letter-spacing:-.04em;margin-bottom:0}h2{font-size:28px;letter-spacing:-.035em;margin-bottom:8px}h3{font-size:16px;margin-bottom:0}.btn{border-radius:10px;padding:10px 15px;border:0;font-weight:700;cursor:pointer}.secondary{background:#fff;border:1px solid #dfe4df}.primary{background:#17231c;color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.75fr);gap:22px}.card{background:#fff;border:1px solid #e0e4df;border-radius:18px;box-shadow:0 10px 35px rgba(30,44,34,.05);padding:24px}.focushead{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:24px;border-bottom:1px solid #e9ece8}.muted{color:#718076}.label{font-size:10px;letter-spacing:.16em;font-weight:800;color:#718076}.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d4f33f var(--p),#edf0ec 0);position:relative;font-weight:800}.ring:after{content:"";position:absolute;width:60px;height:60px;background:white;border-radius:50%}.ring span{z-index:1}.field{margin:22px 0}.field label{font-size:12px;font-weight:800;color:#58645b}.field input,.field textarea{display:block;width:100%;border:0;border-bottom:1px solid #dfe4df;padding:10px 0;color:#19211c;font-size:18px;font-weight:700;outline:none;background:transparent}.field textarea{min-height:70px;resize:vertical}.next{background:#f1f5e6;border:1px solid #dce9a6;border-radius:14px;padding:16px}.listhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.task{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #edf0ec}.task.done span{text-decoration:line-through;color:#9aa29c}.task button{margin-left:auto;border:0;background:transparent;cursor:pointer}.timer{background:#17231c;color:#fff}.clock{font-size:56px;font-weight:800;letter-spacing:-.05em;margin:20px 0 5px}.actions{display:flex;gap:8px;margin-top:18px}.timer .primary{background:#d4f33f;color:#17231c}.timer .secondary{background:transparent;color:white;border-color:#425047}.ideaRow{display:grid;grid-template-columns:1fr 42px;margin:14px 0}.ideaRow input{padding:10px;border:1px solid #dfe4df;border-radius:10px 0 0 10px}.ideaRow button{border:0;background:#17231c;color:#fff;border-radius:0 10px 10px 0}.idea{display:flex;justify-content:space-between;background:#f6f7f5;border-radius:9px;padding:10px;margin:7px 0}.stack{display:grid;gap:22px;max-width:950px}.bar{height:8px;background:#edf0ec;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#bedb32}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.score textarea{width:100%;min-height:55px;margin-top:6px;border:1px solid #e0e5e0;border-radius:9px;padding:8px}.score label{display:block;font-size:11px;font-weight:800;color:#667269;margin-top:15px}.budgetSummary{display:grid;grid-template-columns:repeat(3,1fr)}.budgetSummary>div{padding:0 20px;border-right:1px solid #e6eae6}.budgetSummary>div:last-child{border:0}.budgetSummary strong{font-size:28px}.budgetList>div,.schedule>div{display:grid;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e9ece8}.budgetList>div{grid-template-columns:1fr 120px}.schedule>div{grid-template-columns:110px 1fr 120px 25px 120px}.schedule input,.schedule select,.budgetList input{padding:8px;border:1px solid #dfe4df;border-radius:8px;background:#fff}.hidden{display:none}@media(max-width:980px){.shell{grid-template-columns:82px 1fr}.brand div:last-child,.nav span,.rule{display:none}.nav button{justify-content:center}.grid{grid-template-columns:1fr}.scoregrid{grid-template-columns:1fr}}@media(max-width:640px){.shell{display:block}.sidebar{position:fixed;z-index:10;bottom:0;top:auto;width:100%;height:72px;flex-direction:row;padding:8px}.brand,.rule{display:none}.nav{width:100%;grid-template-columns:repeat(7,1fr)}.nav button{padding:10px 4px}.nav button b{display:none}main{padding:24px 16px 90px}.schedule>div{grid-template-columns:1fr 1fr}.schedule>div strong{grid-column:1/-1}.schedule .to{display:none}.budgetSummary{grid-template-columns:1fr;gap:18px}.budgetSummary>div{border:0;border-bottom:1px solid #e6eae6;padding:0 0 18px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">D</div><div><strong>Diego OS</strong><span>Personal command center</span></div></div><div class="nav" id="nav"></div><div class="rule"><strong>Rule:</strong> New ideas go into the parking lot. They do not replace today’s work.</div></aside><main><div class="top"><div><p id="date"></p><h1 id="title"></h1></div><button class="btn secondary" onclick="resetAll()">Reset</button></div><div id="view"></div></main></div><script>
const KEY='diego-os-v1'; const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const base={projects:{atlas:{name:'ATLAS',desc:'Discretionary assistant, Hermes, GEX and research.',milestone:'Hermes GEX integration',next:'Define the first standardized GEX snapshot schema.',tasks:['Define GEX snapshot schema','Build local recorder','Create Hermes report format','Label first 20 ATLAS + GEX examples']},algobox:{name:'AlgoBox Lab',desc:'Backtest Enigma/Lunch Bot and optimize prop-firm deployment.',milestone:'Replay testing pipeline',next:'Write the exact Claude replay-testing checklist.',tasks:['Freeze baseline settings','Complete 30 replay days','Export trade metrics','Run prop-firm EV optimization']},mason:{name:'Mason Vale',desc:'Automated research, video and newsletter production.',milestone:'Finish research-to-script pipeline',next:'Document the nightly research input and morning output.',tasks:['Finalize source watchlist','Create daily research brief','Create script template','Publish first repeatable episode']},ceo:{name:'CEO Review',desc:'Budget, priorities, blockers and next-week decisions.',milestone:'Weekly operating rhythm',next:'Complete this week’s scorecard and lock next actions.',tasks:['Review completed work','Review AI and data spending','Choose one milestone per project','Process the idea parking lot']}},done:{},schedule:{0:{project:'ceo',start:'10:30',end:'11:00'},1:{project:'atlas',start:'09:00',end:'11:00'},2:{project:'algobox',start:'09:00',end:'11:00'},3:{project:'atlas',start:'09:00',end:'11:00'},4:{project:'mason',start:'09:00',end:'11:00'},5:{project:'ceo',start:'09:00',end:'11:00'},6:{project:'ceo',start:'10:00',end:'11:00'}},ideas:['Prop-firm optimizer SaaS','Honest Water validation','Future ATLAS customer product'],budgetCap:500,budget:[['GEX/data',0],['AI subscriptions & API',0],['Market data',5],['Other tools',0]],review:{atlas:['','',''],algobox:['','',''],mason:['','','']}};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(base), active='today', seconds=7200, running=false, timer;
const icons={today:'◫',atlas:'◩',algobox:'◉',mason:'▲',ceo:'◆',budget:'$',schedule:'◷'}; const labels={today:'Today',atlas:'ATLAS',algobox:'AlgoBox',mason:'Mason Vale',ceo:'CEO Review',budget:'AI Budget',schedule:'Schedule'};
function save(){localStorage.setItem(KEY,JSON.stringify(state))} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function progress(id){const ts=state.projects[id].tasks;return Math.round(ts.filter((_,i)=>state.done[id+'-'+i]).length/ts.length*100)||0}
function nav(){document.getElementById('nav').innerHTML=Object.keys(labels).map(id=>`<button class="${active===id?'active':''}" onclick="show('${id}')"><b>${icons[id]}</b><span>${labels[id]}</span></button>`).join('')}
function show(id){active=id;render()}
function render(){nav();document.getElementById('date').textContent=days[new Date().getDay()]+' · '+new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});document.getElementById('title').textContent=active==='today'?"Today’s focus":labels[active]; const v=document.getElementById('view'); if(active==='today')v.innerHTML=todayView(); else if(['atlas','algobox','mason'].includes(active))v.innerHTML=projectView(active); else if(active==='ceo')v.innerHTML=ceoView(); else if(active==='budget')v.innerHTML=budgetView(); else v.innerHTML=scheduleView();}
function todayView(){const d=new Date().getDay(),pl=state.schedule[d],p=state.projects[pl.project],pct=progress(pl.project);return `<div class="grid"><section class="card"><div class="focushead"><div><span class="label">TODAY’S PROJECT</span><h2>${p.name}</h2><p class="muted">${p.desc}</p></div><div class="ring" style="--p:${pct*3.6}deg"><span>${pct}%</span></div></div>${fields(pl.project,p)}${tasks(pl.project)}</section><div><section class="card timer"><span class="muted">Two-hour focus block</span><div class="clock" id="clock">${fmt()}</div><p class="muted">${pl.start}–${pl.end} · Notifications off · One project only</p><div class="actions"><button class="btn primary" onclick="toggleTimer()">${running?'Pause':'Start'}</button><button class="btn secondary" onclick="resetTimer()">Reset</button></div></section><section class="card" style="margin-top:22px"><span class="label">PROTECTED</span><h3>Idea parking lot</h3><p class="muted">Capture it here. Review it only on CEO day.</p><div class="ideaRow"><input id="ideaInput" placeholder="New idea..." onkeydown="if(event.key==='Enter')addIdea()"><button onclick="addIdea()">+</button></div>${state.ideas.map((x,i)=>`<div class="idea"><span>${esc(x)}</span><button onclick="delIdea(${i})">×</button></div>`).join('')}</section></div></div>`}
function fields(id,p){return `<div class="field"><label>Current milestone</label><input value="${esc(p.milestone)}" onchange="setProject('${id}','milestone',this.value)"></div><div class="field next"><label>Next physical action</label><textarea onchange="setProject('${id}','next',this.value)">${esc(p.next)}</textarea></div>`}
function tasks(id){return `<div class="listhead"><h3>Milestone tasks</h3><button class="btn secondary" onclick="addTask('${id}')">+ Add</button></div>${state.projects[id].tasks.map((t,i)=>`<div class="task ${state.done[id+'-'+i]?'done':''}"><input type="checkbox" ${state.done[id+'-'+i]?'checked':''} onchange="toggleTask('${id}',${i})"><span>${esc(t)}</span><button onclick="delTask('${id}',${i})">×</button></div>`).join('')}`}
function projectView(id){const p=state.projects[id],pct=progress(id);return `<div class="stack"><div><h2>${p.name}</h2><p class="muted">${p.desc}</p></div><section class="card"><div style="display:flex;justify-content:space-between"><span>Milestone completion</span><strong>${pct}%</strong></div><div class="bar"><span style="width:${pct}%"></span></div>${fields(id,p)}${tasks(id)}</section></div>`}
function ceoView(){return `<div><h2>Friday operating review</h2><p class="muted">Close loops, remove blockers, control spending and lock one next action for every project.</p><div class="scoregrid">${['atlas','algobox','mason'].map(id=>{const p=state.projects[id],r=state.review[id],pct=progress(id);return `<section class="card score"><div style="display:flex;justify-content:space-between"><h3>${p.name}</h3><strong>${pct}%</strong></div><div class="bar"><span style="width:${pct}%"></span></div>${['Win','Blocker','Next action'].map((x,i)=>`<label>${x}<textarea onchange="setReview('${id}',${i},this.value)">${esc(r[i])}</textarea></label>`).join('')}</section>`}).join('')}</div></div>`}
function budgetView(){const total=state.budget.reduce((s,x)=>s+Number(x[1]||0),0),pct=Math.min(100,total/state.budgetCap*100);return `<div class="stack"><div><h2>Monthly R&D budget</h2><p class="muted">Every cost must improve trading, create revenue or save meaningful time.</p></div><section class="card budgetSummary"><div><span class="muted">Spent</span><strong>$${total}</strong></div><div><span class="muted">Monthly cap</span><input type="number" value="${state.budgetCap}" onchange="state.budgetCap=+this.value;save();render()"></div><div><span class="muted">Remaining</span><strong>$${Math.max(0,state.budgetCap-total)}</strong></div></section><div class="bar"><span style="width:${pct}%"></span></div><section class="card budgetList">${state.budget.map((x,i)=>`<div><input value="${esc(x[0])}" onchange="state.budget[${i}][0]=this.value;save()"><input type="number" value="${x[1]}" onchange="state.budget[${i}][1]=+this.value;save();render()"></div>`).join('')}</section></div>`}
function scheduleView(){return `<div class="stack"><div><h2>Weekly focus schedule</h2><p class="muted">One project per session. Discretionary trading remains separate from the two-hour build block.</p></div><section class="card schedule">${days.map((d,i)=>{const p=state.schedule[i];return `<div><strong>${d}</strong><select onchange="setSchedule(${i},'project',this.value)">${Object.keys(state.projects).map(id=>`<option value="${id}" ${p.project===id?'selected':''}>${state.projects[id].name}</option>`).join('')}</select><input type="time" value="${p.start}" onchange="setSchedule(${i},'start',this.value)"><span class="to">to</span><input type="time" value="${p.end}" onchange="setSchedule(${i},'end',this.value)"></div>`}).join('')}</section></div>`}
function setProject(id,k,v){state.projects[id][k]=v;save()} function toggleTask(id,i){state.done[id+'-'+i]=!state.done[id+'-'+i];save();render()} function addTask(id){const t=prompt('What is the task?');if(t){state.projects[id].tasks.push(t.trim());save();render()}} function delTask(id,i){state.projects[id].tasks.splice(i,1);save();render()} function addIdea(){const x=document.getElementById('ideaInput').value.trim();if(x){state.ideas.push(x);save();render()}} function delIdea(i){state.ideas.splice(i,1);save();render()} function setReview(id,i,v){state.review[id][i]=v;save()} function setSchedule(i,k,v){state.schedule[i][k]=v;save();render()}
function fmt(){return [Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':')} function tick(){if(seconds>0){seconds--;const c=document.getElementById('clock');if(c)c.textContent=fmt()}else{running=false;clearInterval(timer)}} function toggleTimer(){running=!running;if(running)timer=setInterval(tick,1000);else clearInterval(timer);render()} function resetTimer(){running=false;clearInterval(timer);seconds=7200;render()} function resetAll(){if(confirm('Reset all Diego OS data?')){state=structuredClone(base);save();resetTimer()}} render();
</script></body></html>
