<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diego OS</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf7ff;background:#071018}*{box-sizing:border-box}body{margin:0;background:#071018;color:#edf7ff;background-image:linear-gradient(rgba(60,190,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(60,190,255,.04) 1px,transparent 1px),radial-gradient(circle at 85% 8%,rgba(35,210,235,.12),transparent 28%);background-size:28px 28px,28px 28px,100% 100%}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:rgba(5,14,22,.97);border-right:1px solid rgba(90,190,245,.16);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#b7f34a;color:#071018;font-weight:950;box-shadow:0 0 22px rgba(183,243,74,.25)}.brand span{display:block;color:#87a3b4;font-size:12px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#9ab1c0;padding:12px;border-radius:10px;text-align:left;font-weight:750}.nav button.active,.nav button:hover{color:#fff;background:rgba(82,198,255,.1);box-shadow:inset 3px 0 0 #4bd8ff}.rule{margin-top:auto;border-top:1px solid rgba(120,190,225,.15);padding:18px 8px 0;color:#8fa7b5;font-size:12px;line-height:1.5}main{padding:30px 38px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top p{margin:0 0 4px;color:#8ca6b5;font-size:13px}h1,h2,h3,p{margin-top:0}h1{font-size:32px;letter-spacing:-.04em;margin-bottom:0}h2{font-size:28px;letter-spacing:-.035em;margin-bottom:8px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:850;cursor:pointer}.secondary{background:rgba(255,255,255,.04);color:#dff6ff;border:1px solid rgba(120,205,245,.2)}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.75fr);gap:22px}.card{background:linear-gradient(180deg,rgba(15,30,43,.94),rgba(9,21,32,.94));border:1px solid rgba(91,192,255,.18);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025);padding:24px;backdrop-filter:blur(12px)}.label{font-size:10px;letter-spacing:.16em;font-weight:900;color:#7fa7ba}.muted{color:#8ba4b3}.focushead{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(130,205,240,.12)}.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#4bd8ff var(--p),rgba(255,255,255,.08) 0);position:relative;font-weight:900}.ring:after{content:"";position:absolute;width:60px;height:60px;background:#0c1a26;border-radius:50%}.ring span{z-index:1}.field{margin:22px 0}.field label{font-size:12px;font-weight:900;color:#8fb6c8}.field input,.field textarea{display:block;width:100%;border:0;border-bottom:1px solid rgba(120,205,245,.18);padding:10px 0;color:#edf7ff;font-size:18px;font-weight:800;outline:none;background:transparent}.field textarea{min-height:68px;resize:vertical}.next{background:linear-gradient(135deg,rgba(183,243,74,.11),rgba(75,216,255,.05));border:1px solid rgba(183,243,74,.3);border-radius:14px;padding:16px;box-shadow:0 0 28px rgba(183,243,74,.05)}.next label{color:#b7f34a}.next textarea{color:#eaffbf;font-size:20px;font-weight:900;letter-spacing:-.015em}.listhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.task{display:flex;align-items:center;gap:11px;padding:14px 12px;margin:8px 0;border:1px solid rgba(75,216,255,.12);border-radius:12px;background:rgba(255,255,255,.025)}.task input{width:20px;height:20px;accent-color:#b7f34a}.task span{font-weight:850;color:#f3fbff}.task:not(.done):first-of-type{border-color:rgba(183,243,74,.42);background:rgba(183,243,74,.07);box-shadow:inset 3px 0 0 #b7f34a,0 0 22px rgba(183,243,74,.04)}.task:not(.done):first-of-type span{color:#ddff91}.task.done span{text-decoration:line-through;color:#71828d}.task button{margin-left:auto;border:0;background:transparent;color:#8096a3}.timer{background:linear-gradient(145deg,rgba(8,26,39,.98),rgba(4,14,22,.98))}.clock{font-size:56px;font-weight:950;letter-spacing:-.055em;margin:20px 0 4px}.actions{display:flex;gap:9px;margin-top:18px}.timer .start{background:#b7f34a;color:#081109;box-shadow:0 0 24px rgba(183,243,74,.28);min-width:110px}.timer .start:hover{filter:brightness(1.08)}.habitCard{margin-bottom:22px}.habitGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.habit{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid rgba(94,195,248,.15);border-radius:13px;background:rgba(255,255,255,.025);font-weight:800}.habit input{width:20px;height:20px;accent-color:#b7f34a}.habit.done{background:rgba(183,243,74,.08);border-color:rgba(183,243,74,.35);color:#e6ffae}.ideaRow{display:grid;grid-template-columns:1fr 44px;margin:14px 0}.ideaRow input{padding:11px;border:1px solid rgba(120,205,245,.18);border-radius:10px 0 0 10px;background:rgba(255,255,255,.03);color:#fff}.ideaRow button{border:0;background:#4bd8ff;color:#041019;border-radius:0 10px 10px 0;font-size:20px}.idea{display:flex;justify-content:space-between;background:rgba(255,255,255,.035);border-radius:9px;padding:10px;margin:7px 0}.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#4bd8ff}.stack{display:grid;gap:22px;max-width:950px}@media(max-width:900px){.shell{grid-template-columns:80px 1fr}.brand div:last-child,.nav span,.rule{display:none}.nav button{text-align:center}.grid{grid-template-columns:1fr}}@media(max-width:640px){.shell{display:block}.sidebar{position:fixed;z-index:10;bottom:0;top:auto;width:100%;height:68px;flex-direction:row;padding:8px}.brand,.rule{display:none}.nav{width:100%;grid-template-columns:repeat(7,1fr)}.nav button{font-size:0;padding:9px 3px}.nav button:before{font-size:16px}main{padding:22px 15px 88px}.habitGrid{grid-template-columns:1fr 1fr}.card{border-radius:16px}.clock{font-size:50px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">D</div><div><strong>Diego OS</strong><span>Personal command center</span></div></div><div class="nav" id="nav"></div><div class="rule"><strong>Rule:</strong> New ideas go into the parking lot. They do not replace today’s work.</div></aside><main><div class="top"><div><p id="date"></p><h1 id="title"></h1></div><button class="btn secondary" onclick="resetAll()">Reset</button></div><div id="view"></div></main></div><script>
const KEY='diego-os-v2';const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const base={projects:{atlas:{name:'ATLAS',desc:'Discretionary assistant, Hermes, GEX and research.',milestone:'Hermes GEX integration',next:'Define the first standardized GEX snapshot schema.',tasks:['Define GEX snapshot schema','Build local recorder','Create Hermes report format','Label first 20 ATLAS + GEX examples']},algobox:{name:'AlgoBox Lab',desc:'Backtest Enigma/Lunch Bot and optimize prop-firm deployment.',milestone:'Replay testing pipeline',next:'Write the exact Claude replay-testing checklist.',tasks:['Freeze baseline settings','Complete 30 replay days','Export trade metrics','Run prop-firm EV optimization']},mason:{name:'Mason Vale',desc:'Automated research, video and newsletter production.',milestone:'Finish research-to-script pipeline',next:'Document the nightly research input and morning output.',tasks:['Finalize source watchlist','Create daily research brief','Create script template','Publish first repeatable episode']},ceo:{name:'CEO Review',desc:'Budget, priorities, blockers and next-week decisions.',milestone:'Weekly operating rhythm',next:'Complete this week’s scorecard and lock next actions.',tasks:['Review completed work','Review AI and data spending','Choose one milestone per project','Process the idea parking lot']}},done:{},schedule:{0:{project:'ceo',start:'10:30',end:'11:00'},1:{project:'atlas',start:'10:00',end:'12:00'},2:{project:'algobox',start:'10:00',end:'12:00'},3:{project:'atlas',start:'10:00',end:'12:00'},4:{project:'mason',start:'10:00',end:'12:00'},5:{project:'ceo',start:'10:00',end:'12:00'},6:{project:'ceo',start:'10:00',end:'11:00'}},ideas:['Prop-firm optimizer SaaS','Honest Water validation','Future ATLAS customer product'],habits:{}};let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(base),active='today',seconds=7200,running=false,timer;const labels={today:'Today',atlas:'ATLAS',algobox:'AlgoBox',mason:'Mason Vale',ceo:'CEO',budget:'Budget',schedule:'Schedule'};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function progress(id){const t=state.projects[id].tasks;return Math.round(t.filter((_,i)=>state.done[id+'-'+i]).length/t.length*100)||0}function nav(){document.getElementById('nav').innerHTML=Object.keys(labels).map(id=>`<button class="${active===id?'active':''}" onclick="show('${id}')"><span>${labels[id]}</span></button>`).join('')}function show(id){active=id;render()}function render(){nav();document.getElementById('date').textContent=days[new Date().getDay()]+' · '+new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});document.getElementById('title').textContent=active==='today'?"Today’s focus":labels[active];document.getElementById('view').innerHTML=active==='today'?todayView():['atlas','algobox','mason'].includes(active)?projectView(active):active==='ceo'?projectView('ceo'):active==='schedule'?scheduleView():`<section class="card"><h2>AI budget</h2><p class="muted">Review spending on CEO Day.</p></section>`}function todayView(){const d=new Date().getDay(),pl=state.schedule[d],p=state.projects[pl.project],pct=progress(pl.project),key=new Date().toISOString().slice(0,10),hs=state.habits[key]||{},habits=['Up by 8:00 AM','Gym completed','2-hour mission','Traded to plan / no valid trade'];return `<section class="card habitCard"><span class="label">DAILY SCOREBOARD</span><div class="habitGrid">${habits.map((h,i)=>`<label class="habit ${hs[i]?'done':''}"><input type="checkbox" ${hs[i]?'checked':''} onchange="toggleHabit('${key}',${i})"><span>${h}</span></label>`).join('')}</div></section><div class="grid"><section class="card"><div class="focushead"><div><span class="label">TODAY’S PROJECT</span><h2>${p.name}</h2><p class="muted">${p.desc}</p></div><div class="ring" style="--p:${pct*3.6}deg"><span>${pct}%</span></div></div>${fields(pl.project,p)}${tasks(pl.project)}</section><div><section class="card timer"><span class="muted">Two-hour focus block</span><div class="clock" id="clock">${fmt()}</div><p class="muted">${pl.start}–${pl.end} · One project only</p><div class="actions"><button class="btn start" onclick="toggleTimer()">${running?'Pause':'Start'}</button><button class="btn secondary" onclick="resetTimer()">Reset</button></div></section><section class="card" style="margin-top:22px"><span class="label">PROTECTED</span><h3>Idea parking lot</h3><p class="muted">Capture it here. Review it on CEO Day.</p><div class="ideaRow"><input id="ideaInput" placeholder="New idea..." onkeydown="if(event.key==='Enter')addIdea()"><button onclick="addIdea()">+</button></div>${state.ideas.map((x,i)=>`<div class="idea"><span>${esc(x)}</span><button onclick="delIdea(${i})">×</button></div>`).join('')}</section></div></div>`}function fields(id,p){return `<div class="field"><label>Current milestone</label><input value="${esc(p.milestone)}" onchange="setProject('${id}','milestone',this.value)"></div><div class="field next"><label>Next physical action</label><textarea onchange="setProject('${id}','next',this.value)">${esc(p.next)}</textarea></div>`}function tasks(id){return `<div class="listhead"><h3>Milestone tasks</h3><button class="btn secondary" onclick="addTask('${id}')">+ Add</button></div>${state.projects[id].tasks.map((t,i)=>`<div class="task ${state.done[id+'-'+i]?'done':''}"><input type="checkbox" ${state.done[id+'-'+i]?'checked':''} onchange="toggleTask('${id}',${i})"><span>${esc(t)}</span><button onclick="delTask('${id}',${i})">×</button></div>`).join('')}`}function projectView(id){const p=state.projects[id],pct=progress(id);return `<div class="stack"><section class="card"><div style="display:flex;justify-content:space-between"><h2>${p.name}</h2><strong>${pct}%</strong></div><p class="muted">${p.desc}</p><div class="bar"><span style="width:${pct}%"></span></div>${fields(id,p)}${tasks(id)}</section></div>`}function scheduleView(){return `<section class="card"><h2>Weekly focus schedule</h2><p class="muted">Monday ATLAS · Tuesday AlgoBox · Wednesday ATLAS · Thursday Mason Vale · Friday CEO Day</p></section>`}function toggleHabit(k,i){state.habits[k]=state.habits[k]||{};state.habits[k][i]=!state.habits[k][i];save();render()}function setProject(id,k,v){state.projects[id][k]=v;save()}function toggleTask(id,i){state.done[id+'-'+i]=!state.done[id+'-'+i];save();render()}function addTask(id){const t=prompt('What is the task?');if(t){state.projects[id].tasks.push(t.trim());save();render()}}function delTask(id,i){state.projects[id].tasks.splice(i,1);save();render()}function addIdea(){const x=document.getElementById('ideaInput').value.trim();if(x){state.ideas.push(x);save();render()}}function delIdea(i){state.ideas.splice(i,1);save();render()}function fmt(){return [Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':')}function tick(){if(seconds>0){seconds--;const c=document.getElementById('clock');if(c)c.textContent=fmt()}else{running=false;clearInterval(timer)}}function toggleTimer(){running=!running;if(running)timer=setInterval(tick,1000);else clearInterval(timer);render()}function resetTimer(){running=false;clearInterval(timer);seconds=7200;render()}function resetAll(){if(confirm('Reset all Diego OS data?')){state=structuredClone(base);save();resetTimer()}}render();
</script></body></html>
